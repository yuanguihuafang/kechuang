[project]
name = "kechuang"
version = "0.1.0"
description = "科创大模型知识库平台：统一网关、Perception、Retrieval 与共享契约"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "alembic>=1.13.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=3.1.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pymysql>=1.1.1",
  "boto3>=1.35.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "pymilvus==2.6.17",
  "pandas==2.2.3",
  "json-repair>=0.61.0",
  "opentelemetry-api>=1.27.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.28,<2",
]
mineru = [
  "mineru[pipeline]>=3.4.4",
  "pillow>=10.0.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".", "agents"]
include = ["admin*", "assistant*", "agents*", "api*", "core*", "runtime*", "services*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = [
  "tests",
]
pythonpath = [
  ".",
]
addopts = ["--basetemp=.pytest_tmp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
